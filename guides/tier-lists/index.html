<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Kingshot hero tier lists for Bear Trap, Castle / KvK and Arena – by generation, for rally leaders and joiners.">
  <title>Hero Tier Lists · Kingshot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
  <link rel="stylesheet" href="../../assets/styles.css">
  <link rel="stylesheet" href="tier-lists.css">
</head>
<body>
  <nav class="crumb">
    <a class="back" href="../" data-i18n="back"></a>
    <div id="langSwitch" class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
  </nav>
  <header class="top">
    <div class="brand">
      <span class="mark trophy" aria-hidden="true">🏆</span>
      <div>
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 data-i18n="title"></h1>
      </div>
    </div>
  </header>

  <main>
    <p class="lead" data-i18n="lead"></p>

    <section class="card controls">
      <div class="seg modes" id="modes" role="tablist">
        <button type="button" role="tab" data-mode="bear"><span aria-hidden="true">🐻</span> <span data-i18n="modeBear"></span></button>
        <button type="button" role="tab" data-mode="castle"><span aria-hidden="true">🏰</span> <span data-i18n="modeCastle"></span></button>
        <button type="button" role="tab" data-mode="arena"><span aria-hidden="true">⚔️</span> <span data-i18n="modeArena"></span></button>
      </div>

      <div class="row-ctl">
        <span class="ctl-label" data-i18n="genLabel"></span>
        <div class="seg gens" id="gens"></div>
      </div>

      <div class="row-ctl" id="roleRow">
        <span class="ctl-label" data-i18n="roleLabel"></span>
        <div class="seg roles" id="roles">
          <button type="button" data-role="leaders"><span aria-hidden="true">👑</span> <span data-i18n="roleLeaders"></span></button>
          <button type="button" data-role="joiners"><span aria-hidden="true">🤝</span> <span data-i18n="roleJoiners"></span></button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 id="listTitle"></h2>
      <p id="listIntro" class="muted"></p>
      <div id="tiers" class="tiers"></div>
    </section>

    <section class="card info">
      <h2 data-i18n="formationTitle"></h2>
      <div id="formation"></div>
      <h2 class="mt" data-i18n="tipsTitle"></h2>
      <ul id="tips" class="tips"></ul>
    </section>

    <p class="source">
      <span data-i18n="sourceLabel"></span>
      <a id="sourceLink" target="_blank" rel="noopener noreferrer"></a>
      · <span id="updated"></span>
    </p>
  </main>

  <footer class="foot"><span id="footerText"></span><span class="credit">provided for free with love by HUGO</span><small class="disclaimer">This is a fan-made website and is not affiliated with, endorsed by, or associated with Century Games or the official developers of Kingshot. All game assets, imagery, and text content are copyrights of their respective owners.</small></footer>

  <script src="../../assets/lang.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
