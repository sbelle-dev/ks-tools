<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Community-Tools für Kingshot: Rally Sync und Reinforcement Timer.">
  <title>Kingshot Tools</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .tools { display: grid; gap: 14px; }
    @media (min-width: 680px) { .tools { grid-template-columns: 1fr 1fr; } }
    .tool {
      display: flex; flex-direction: column; gap: 8px;
      text-decoration: none; color: var(--text);
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; transition: border-color .15s, transform .1s;
    }
    .tool:hover { border-color: var(--accent); }
    .tool:active { transform: translateY(1px); }
    .tool .ico {
      display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
      background: var(--surface-2); font-size: 22px;
    }
    .tool h2 { margin: 4px 0 0; }
    .tool p { margin: 0; color: var(--muted); }
    .tool .go { margin-top: auto; padding-top: 6px; color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">⚔</span>
      <div>
        <p class="eyebrow">Kingshot</p>
        <h1 data-i18n="title">Tools</h1>
      </div>
    </div>
    <button id="langBtn" class="ghost small" type="button">EN</button>
  </header>

  <main>
    <p class="lead" data-i18n="lead"></p>
    <div class="tools">
      <a class="tool" href="rally/">
        <span class="ico" aria-hidden="true">⚔️</span>
        <h2>Rally Sync</h2>
        <p data-i18n="rallyDesc"></p>
        <span class="go" data-i18n="open"></span>
      </a>
      <a class="tool" href="reinforce/">
        <span class="ico" aria-hidden="true">🛡️</span>
        <h2>Reinforcement Timer</h2>
        <p data-i18n="reinfDesc"></p>
        <span class="go" data-i18n="open"></span>
      </a>
    </div>
  </main>

  <footer class="foot"><span data-i18n="foot"></span></footer>

  <script>
    (() => {
      const T = {
        de: {
          title: 'Tools',
          lead: 'Kleine Helfer für Rallys und Verteidigung – laufen komplett im Browser, ohne Anmeldung.',
          rallyDesc: 'Startverzögerungen berechnen, damit mehrere Rallys gleichzeitig einschlagen. Mit visuellem Countdown.',
          reinfDesc: 'Verstärkungen so timen, dass sie direkt nach einer Gegner-Rally landen – bevor die nächste einschlägt.',
          open: 'Öffnen →',
          foot: 'Community-Tools für Kingshot',
        },
        en: {
          title: 'Tools',
          lead: 'Small helpers for rallies and defense – running entirely in your browser, no sign-in.',
          rallyDesc: 'Calculate launch delays so multiple rallies land together. With a visual countdown.',
          reinfDesc: 'Time reinforcements to land right after an enemy rally hits – before the next one arrives.',
          open: 'Open →',
          foot: 'Community tools for Kingshot',
        },
      };
      let lang;
      try { lang = localStorage.getItem('kstools.lang'); } catch { lang = null; }
      if (!lang) lang = (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en';
      const btn = document.getElementById('langBtn');
      function apply() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[lang][el.dataset.i18n]; });
        btn.textContent = lang === 'de' ? 'EN' : 'DE';
      }
      btn.addEventListener('click', () => {
        lang = lang === 'de' ? 'en' : 'de';
        try { localStorage.setItem('kstools.lang', lang); } catch { /* egal */ }
        apply();
      });
      apply();
    })();
  </script>
</body>
</html>
